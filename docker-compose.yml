services:
  init-secrets:
    image: busybox:1.36
    restart: "no"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin-ussc}
    volumes:
      - secrets_data:/secrets
      - ./scripts/generate-secrets.sh:/generate-secrets.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - "tr -d '\\r' < /generate-secrets.sh > /tmp/generate-secrets.sh && /bin/sh /tmp/generate-secrets.sh"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appsec}
      POSTGRES_PASSWORD_FILE: /secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-appsec_ctf}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - secrets_data:/secrets:ro
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appsec} -d ${POSTGRES_DB:-appsec_ctf}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    image: appsec_ctf-api:local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appsec}
      POSTGRES_DB: ${POSTGRES_DB:-appsec_ctf}
      POSTGRES_HOST: db
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin-ussc}
      UPLOAD_DIR: /data/uploads
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
    volumes:
      - uploads_data:/data/uploads
      - secrets_data:/secrets:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    image: appsec_ctf-web:local
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:8000
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appsec}
      POSTGRES_DB: ${POSTGRES_DB:-appsec_ctf}
      PGHOST: db
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./scripts/backup-entrypoint.sh:/backup-entrypoint.sh:ro
      - backup_data:/backups
      - secrets_data:/secrets:ro
    entrypoint:
      - /bin/sh
      - -c
      - "tr -d '\\r' < /backup-entrypoint.sh > /tmp/backup-entrypoint.sh && tr -d '\\r' < /backup.sh > /tmp/backup.sh && /bin/sh /tmp/backup-entrypoint.sh"
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  backup_data:
  secrets_data:
