services:
  init-secrets:
    image: busybox:1.36
    restart: "no"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin-ussc}
    volumes:
      - secrets_data:/secrets
      - ./scripts/generate-secrets.sh:/generate-secrets.sh:ro
    entrypoint: ["/bin/sh", "-c", "sed -i 's/\\r$//' /generate-secrets.sh && /bin/sh /generate-secrets.sh"]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appsec}
      POSTGRES_PASSWORD_FILE: /secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-appsec_ctf}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - secrets_data:/secrets:ro
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appsec} -d ${POSTGRES_DB:-appsec_ctf}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appsec}
      POSTGRES_DB: ${POSTGRES_DB:-appsec_ctf}
      POSTGRES_HOST: db
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin-ussc}
      UPLOAD_DIR: /data/uploads
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,https://localhost:8443,http://127.0.0.1:8080,https://127.0.0.1:8443}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - uploads_data:/data/uploads
      - secrets_data:/secrets:ro
    # API не публикуется наружу — только через Caddy
    expose:
      - "8000"
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:8000
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:${HTTP_PORT:-8080}:80"
      - "0.0.0.0:${HTTPS_PORT:-8443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appsec}
      POSTGRES_DB: ${POSTGRES_DB:-appsec_ctf}
      PGHOST: db
      PGPASSWORD_FILE: /secrets/postgres_password
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./scripts/backup-entrypoint.sh:/backup-entrypoint.sh:ro
      - backup_data:/backups
      - secrets_data:/secrets:ro
    entrypoint: ["/bin/sh", "-c", "sed -i 's/\\r$//' /backup-entrypoint.sh /backup.sh && /bin/sh /backup-entrypoint.sh"]
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  backup_data:
  caddy_data:
  caddy_config:
  secrets_data:
